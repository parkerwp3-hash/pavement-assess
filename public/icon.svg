<!--
  App mark: a crack running through pavement — the distress the tool exists to
  record. Black field, white stroke, square caps and mitred joins to match the
  in-app icon geometry, drawn heavy enough to read at 16px in a browser tab and
  on a phone home screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#000000" />
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <path d="M35 4 L26 22 L37 34 L27 48 L33 60" />
    <path d="M37 34 L52 27" />
  </g>
</svg>
