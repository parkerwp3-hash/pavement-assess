<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pavement Assess">
  <rect width="64" height="64" fill="#000000"/>
  <!-- Stall striping: a lot seen from above. -->
  <g fill="#ffffff">
    <rect x="12" y="14" width="6" height="16"/>
    <rect x="24" y="14" width="6" height="16"/>
    <rect x="36" y="14" width="6" height="16"/>
    <rect x="48" y="14" width="4" height="16"/>
  </g>
  <!-- Drive lane. -->
  <rect x="8" y="36" width="48" height="2" fill="#ffffff" opacity="0.45"/>
  <g fill="#ffffff">
    <rect x="12" y="44" width="6" height="6"/>
    <rect x="24" y="44" width="6" height="6"/>
    <rect x="36" y="44" width="6" height="6"/>
    <rect x="48" y="44" width="4" height="6"/>
  </g>
</svg>
